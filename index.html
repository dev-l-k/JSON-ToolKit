<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON ToolKit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>JSON ToolKit</h1>
        <p>Format Minify Convert JSON</p>
    </header>
    <main>
    <section id="format" class="tool">
        <h2>JSON FORMATTER</h2>
        <textarea id="jsonInput" placeholder="Paste JSON code here...."></textarea>
        <div class="actions">
            <button class="btn" onclick="formatJSON()">Format</button>
            <button class="btn" onclick="minifyJSON()">Minify</button>
            <button class="btn" onclick="copyOutput()">Copy</button>
            <button class="btn" onclick="downloadJSON()">Download</button>
            <button class="btn" onclick="clearJSON()">Clear</button>
            <button class="btn" onclick="loadDemo()">Load Demo</button>
        </div>

        <div id="formatStatus" class="status">Ready</div>
        <textarea id="jsonOutput" placeholder="Output will appear here..."></textarea>
    </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
